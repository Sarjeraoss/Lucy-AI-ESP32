name: Build Lucy Clipbot C3 AI-only firmware

on:
  push:
    branches:
      - fix/clipbot-online-chat-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clipbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build ESP32-C3 Clipbot (SH1106 configuration)
        working-directory: offline
        run: pio run -e lucy_clipbot_c3
      - name: Stage app-only firmware
        run: |
          mkdir -p release
          cp offline/.pio/build/lucy_clipbot_c3/firmware.bin release/lucy-clipbot-c3-ai-only-app.bin
          sha256sum release/lucy-clipbot-c3-ai-only-app.bin > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lucy-clipbot-c3-ai-only-app
          path: release/
          retention-days: 30
